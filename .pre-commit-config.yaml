repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff the dev group locks (poetry.lock), so a
    # commit that passes here also passes the CI-node lint/format steps.
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy --strict
        language: system
        types: [python]
        pass_filenames: true
